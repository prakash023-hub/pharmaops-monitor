# PharmaOps CSV field extraction — install app then re-ingest data
# After ingest: status, batch_id, temperature_C etc. are searchable fields

[temperature_logs.csv]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = none
TRUNCATE = 0
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
REPORT-pharma_temp = pharma-temperature-csv

