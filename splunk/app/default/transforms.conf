[pharma-temperature-csv]
DELIMS = ","
FIELDS = "timestamp","batch_id","equipment_id","product","temperature_C","status","gmp_lower_C","gmp_upper_C"

[pharma-moisture-csv]
DELIMS = ","
FIELDS = "timestamp","batch_id","equipment_id","product","moisture_pct","status","gmp_max_moisture_pct"

[pharma-batch-csv]
DELIMS = ","
FIELDS = "timestamp","batch_id","product","yield_pct","deviation_count","batch_status","oee_score","failure_mode"

[pharma-equipment-csv]
DELIMS = ","
FIELDS = "timestamp","equipment_id","equipment_type","downtime_minutes","reason","severity"
